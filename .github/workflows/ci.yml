name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Samples are reproducible
        run: |
          python scripts/make_samples.py
          git diff --exit-code src/dayag/samples

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dayag .
      - name: Smoke test the container
        run: |
          docker run -d --name dayag -p 8000:8000 dayag
          for i in $(seq 1 20); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS --data-binary @src/dayag/samples/02-paypal-homoglyph.eml \
            -H "Content-Type: message/rfc822" localhost:8000/api/analyze | grep -q '"verdict": *"malicious"'
