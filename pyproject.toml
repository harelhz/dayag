[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dayag"
version = "0.1.0"
description = "Phishing email analyzer for SOC analysts: sender authentication, spoofing, lookalike domains, malicious links and attachments, IOC export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harel Hazani" }]
requires-python = ">=3.11"
keywords = ["phishing", "email", "soc", "security", "dfir", "ioc", "stix"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = [
  "dnspython>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "rich>=13.7",
  "tldextract>=5.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["dayag[web]", "mypy>=1.10", "pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
dayag = "dayag.cli:main"

[project.urls]
Homepage = "https://github.com/harelhz/dayag"
Issues = "https://github.com/harelhz/dayag/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dayag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/dayag"]

[[tool.mypy.overrides]]
module = ["tldextract.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
